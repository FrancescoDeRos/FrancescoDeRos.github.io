      const sp = Math.sin(p), cp = Math.cos(p), sd = Math.sin(d), cd = Math.cos(d), sl = Math.sin(l), cl = Math.cos(l);

      const img = g.createImageData(N, N);
      const M = mecaTensor(+strike, +dip, +rake), fc = rgbOf(fill);
      const c0 = N / 2, Rr = N / 2 - 1, inv = 1 / (Rr * Math.SQRT2);
      for (let py = 0; py < N; py++) {
        const dy = c0 - (py + 0.5);
        for (let px = 0; px < N; px++) {
          const dx = (px + 0.5) - c0;

          const th = 2 * Math.asin(Math.min(1, rr * inv));   // rr = R*sqrt(2)*sin(th/2)
          const az = Math.atan2(dx, dy);                     // azimuth antior da N

    function computeKDE() {
      if (!events.length) return;
      const lat0 = events[0].lat, lon0 = events[0].lon;
      const kx = 111.32 * Math.cos(lat0 * Math.PI / 180), ky = 110.57;
      const bw = Math.max(1, kdeBW);
      const CELL = Math.max(bw, 1);
      const grid = new Map();
      const key = (i, j) => i + ',' + j;
      events.forEach(e => {
        const x = (e.lon - lon0) * kx, y = (e.lat - lat0) * ky;
        const i = Math.floor(x / CELL), j = Math.floor(y / CELL);
        const k = key(i, j);
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push({ x, y });
      });
      const bw2 = 2 * bw * bw;
      const RAD = Math.ceil(bw / CELL) + 1;
      events.forEach(e => {

        const i = Math.floor(x / CELL), j = Math.floor(y / CELL);
        let sum = 0;
        for (let di = -RAD; di <= RAD; di++) for (let dj = -RAD; dj <= RAD; dj++) {

    function computeKDEGrid() {

      const bw = Math.max(1, kdeBW);
      let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
      const pts = events.map(e => {
        const x = (e.lon - lon0) * kx, y = (e.lat - lat0) * ky;
        if (x < xmin) xmin = x; if (x > xmax) xmax = x;
        if (y < ymin) ymin = y; if (y > ymax) ymax = y;
        return { x, y };

      const pad = bw * 2;
      xmin -= pad; xmax += pad; ymin -= pad; ymax += pad;
      const maxN = 320;
      let CELL = Math.max(1, bw / 2);
      CELL = Math.max(CELL, (xmax - xmin) / maxN, (ymax - ymin) / maxN);
      const gw = Math.max(2, Math.ceil((xmax - xmin) / CELL) + 1);
      const gh = Math.max(2, Math.ceil((ymax - ymin) / CELL) + 1);
      xmax = xmin + (gw - 1) * CELL;
      ymax = ymin + (gh - 1) * CELL;
      const grid = new Float32Array(gw * gh);
      const inv2 = 1 / (2 * bw * bw);

        const gx = Math.round((p.x - xmin) / CELL), gy = Math.round((p.y - ymin) / CELL);

          const i = gx + kern[k][0], j = gy + kern[k][1];

      for (let k = 0; k < grid.length; k++) {

      const norm = new Float32Array(grid.length);

function parseYMD(s) {
  //YYYYMMDD, YYYY-MM-DD, YYYY/MM/DD, YYYY MM DD
  const digits = String(s || '').replace(/\D/g, '');
  if (digits.length !== 8) return NaN;
  const y = +digits.slice(0, 4), m = +digits.slice(4, 6), d = +digits.slice(6, 8);
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return NaN;
  return dt.getTime();
}

function fmtYMD(ms) {
  const d = new Date(ms);
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate());
}

function syncDateInputs() {
  const s = $('dtStart'), e = $('dtEnd');
  if (!s || !e) return;
  const span = rangeEnd - rangeStart;
  if (!dtDirty.start && document.activeElement !== s)
    s.value = fmtYMD(rangeStart + sel.a * span);
  if (!dtDirty.end && document.activeElement !== e) {
    const endMs = rangeStart + sel.b * span;
    e.value = fmtYMD(Math.max(rangeStart, endMs - 1));
  }
}

function applyDateRange() {
  const info = $('info');
  const sVal = $('dtStart').value, eVal = $('dtEnd').value;
  const sMs = parseYMD(sVal);
  const eMs = parseYMD(eVal);
  if (!isFinite(sMs) || !isFinite(eMs)) {
    console.warn('[date-range] parse failed:', sVal, eVal);
    info.textContent = 'Date range: enter YYYYMMDD (or YYYY-MM-DD) for both START and END';
    return;
  }
  if (sMs > eMs) {
    info.textContent = 'Date range: START is after END';
    return;
  }
  const now = Date.now();
  if (sMs >= now) { info.textContent = 'Date range: START is in the future'; return; }
  customRange = { s: sMs, e: Math.min(now, eMs + 864e5) };
  sel.a = 0; sel.b = 1;
  dtDirty.start = false; dtDirty.end = false;
  fetchEarthquakes();     
}

    function draw3D() {
      if (win3d.style.display !== 'flex') return;
      const [c, W, H] = fitCanvas(cv3);
      c.fillStyle = '#0f1722'; c.fillRect(0, 0, W, H);
      if (!activeSec) return;
      const s = activeSec;
      const g = s.g, D = slabDepth(), hx = g.L / 2, hy = g.hw, hz = D / 2, m = Math.max(hx, hy, hz);
      const sx = v3.eq ? 1 / m : 1 / hx, sy = v3.eq ? 1 / m : 1 / hy, sz = v3.eq ? 1 / m : 1 / hz;
      const ex = hx * sx, ey = hy * sy, ez = hz * sz;
      const ca = Math.cos(v3.az), sa = Math.sin(v3.az), ce = Math.cos(v3.el), se = Math.sin(v3.el), sc = Math.min(W, H) * 0.27 * v3.zoom;
      const P = (X, Y, Z) => { const x1 = X * ca - Y * sa, y1 = X * sa + Y * ca, w = y1 * ce + Z * se, f = 1 / (1 + 0.15 * w); return [W / 2 + x1 * f * sc, H / 2 + (Z * ce - y1 * se) * f * sc, w, f]; };
      const cs = []; for (let i = 0; i < 8; i++) cs.push(P((i & 1 ? 1 : -1) * ex, (i & 2 ? 1 : -1) * ey, (i & 4 ? 1 : -1) * ez));
      c.beginPath(); [0, 1, 3, 2].forEach((i, k) => k ? c.lineTo(cs[i][0], cs[i][1]) : c.moveTo(cs[i][0], cs[i][1])); c.closePath();
      c.fillStyle = 'rgba(80,160,255,.14)'; c.fill();
      c.strokeStyle = 'rgba(190,205,230,.55)'; c.lineWidth = 1;
      for (let i = 0; i < 8; i++) [1, 2, 4].forEach(b => { if (!(i & b)) { c.beginPath(); c.moveTo(cs[i][0], cs[i][1]); c.lineTo(cs[i | b][0], cs[i | b][1]); c.stroke(); } });
      const pts = s.slab.map(sp => ({ p: P((sp.t - hx) * sx, sp.d * sy, (sp.e.depth - hz) * sz), s: sp })).sort((a, b) => b.p[2] - a.p[2]);
      pts.forEach(({ p, s: sp }) => {
        const r = Math.max(1.5, sp.e.mag * 1.5) * p[3] * Math.sqrt(v3.zoom);
        c.beginPath(); c.arc(p[0], p[1], r, 0, 6.2832); c.globalAlpha = .9; c.fillStyle = colorOf(sp.e); c.fill(); c.globalAlpha = 1; c.lineWidth = .5; c.strokeStyle = '#000'; c.stroke();
      });
      c.font = 'bold 12px sans-serif'; c.fillStyle = '#00e5ff'; c.textAlign = 'center';
      const pa = P(-ex, 0, -ez), pb = P(ex, 0, -ez); c.fillText(s.la || 'A', pa[0], pa[1] - 6); c.fillText(s.lb || 'B', pb[0], pb[1] - 6);
      c.font = '10px sans-serif'; c.fillStyle = '#aab6c8'; c.textAlign = 'left';
      const p0 = P(-ex, -ey, -ez), p1 = P(-ex, -ey, ez); c.fillText('0 km', p0[0] + 4, p0[1] - 3); c.fillText(D + ' km', p1[0] + 4, p1[1] + 11);
      $('info3').textContent = s.slab.length + ' events \u00b7 ' + g.L.toFixed(0) + '\u00d7' + s.width + '\u00d7' + D + ' km \u00b7 drag = rotate, wheel = zoom';
    }

      const ms = String(d.getUTCMilliseconds()).padStart(3, '0');

    async function exportCatalog(pts) {
      const info = $('info');
      const span = rangeEnd - rangeStart;
      const t0 = rangeStart + sel.a * span, t1 = rangeStart + sel.b * span;
      const lats = pts.map(p => p.lat), lons = pts.map(p => p.lng);
      const minlat = Math.min(...lats), maxlat = Math.max(...lats);
      const minlon = Math.min(...lons), maxlon = Math.max(...lons);
      const polyH = pts.map(p => [p.lng, p.lat]);
      const base = 'https://webservices.ingv.it/fdsnws/event/1/query?format=geojson&orderby=time&limit=10000' +
        `&minlatitude=${minlat.toFixed(3)}&maxlatitude=${maxlat.toFixed(3)}` +
        `&minlongitude=${minlon.toFixed(3)}&maxlongitude=${maxlon.toFixed(3)}`;
      const CHUNK = 180 * 864e5;
      const n = Math.max(1, Math.ceil((t1 - t0) / CHUNK));
      const found = [], seen = new Set();
      for (let i = 0; i < n; i++) {
        const a = t0 + i * CHUNK, b = Math.min(t0 + (i + 1) * CHUNK, t1);
        info.textContent = `Polygon catalog: request ${i + 1}/${n}…`;
        try {
          const res = await fetch(`${base}&starttime=${fmtISO(new Date(a))}&endtime=${fmtISO(new Date(b))}`);
          if (res.status === 204) continue;
          if (!res.ok) { console.warn('catalog chunk', res.status); continue; }
          const data = await res.json();
          (data.features || []).forEach(f => {
            const e = mapEvent(f);
            if (seen.has(e.eventId)) return;
            if (!inside(polyH, e.lon, e.lat)) return;
            seen.add(e.eventId);
            found.push(e);
          });
        } catch (err) { console.warn('catalog chunk', err); }
      }
      found.sort((a, b) => a.ms - b.ms);
      const txt = found.map(eventLine).join('\n') + (found.length ? '\n' : '');
      const d = new Date();
      const name = `catalog_${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}_${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}.txt`;
      downloadText(name, txt);
      info.textContent = `${name} — ${found.length} events (${fmtUTC(t0)} → ${fmtUTC(t1)} UTC)`;
    }

    function buildPicksTxt(doc) {
      const all = (el, name) => el ? Array.from(el.getElementsByTagNameNS('*', name)) : [];
      const first = (el, name) => all(el, name)[0] || null;
      const tx = n => n ? (n.textContent || '').trim() : '';
      const val = (el, name) => { const n = first(el, name); if (!n) return ''; const v = first(n, 'value') || n; return tx(v); };
      const unc = el => el ? tx(first(el, 'uncertainty')) : '';

      const ev = first(doc, 'event') || doc.documentElement;
      const org = first(ev, 'origin') || ev;
      const latEl = first(org, 'latitude'), lonEl = first(org, 'longitude'), depEl = first(org, 'depth');
      const magEl = first(org, 'magnitude') || first(ev, 'magnitude');
      const magV = magEl ? val(magEl, 'value') : '';

      const picks = new Map();
      all(ev, 'pick').forEach(p => {
        const w = first(p, 'waveformID');
        let pol = tx(first(p, 'polarity'));
        if (/^positive$/i.test(pol)) pol = '+';
        else if (/^negative$/i.test(pol)) pol = '-';
        else if (pol) pol = '?';
        picks.set(p.getAttribute('publicID') || '', {
          sta: w ? (w.getAttribute('stationCode') || '') : '',
          net: w ? (w.getAttribute('networkCode') || '') : '',
          time: val(p, 'time'),
          pol,
          pha: tx(first(p, 'phaseHint'))
        });
      });

      const num = v => (v !== '' && isFinite(+v)) ? (+v).toFixed(2) : (v || '-');
      const rows = [];
      all(org, 'arrival').forEach(a => {
        const pk = picks.get(tx(first(a, 'pickID'))) || { sta: '', net: '', time: '', pol: '', pha: '' };
        rows.push([
          (pk.sta || '-').padEnd(4),
          (pk.net || '-').padEnd(3),
          pk.time || '-',
          pk.pol || '-',
          tx(first(a, 'phase')) || pk.pha || '-',
          num(val(a, 'azimuth')),
          num(val(a, 'distance')),
          num(val(a, 'takeoffAngle')),
          num(val(a, 'timeResidual'))
        ].join(' '));
      });

      const out = [
        '#TIMEUTC LAT UNC_LAT LONG UNC_LON PROF UNC_PROF M UNC_M',
        `#${val(org, 'time') || '-'} ${val(org, 'latitude') || '-'} ${unc(latEl) || '0'} ` +
        `${val(org, 'longitude') || '-'} ${unc(lonEl) || '0'} ${val(org, 'depth') || '-'} ${unc(depEl) || '0'} ` +
        `${magV || '-'} ${magEl ? (unc(magEl) || '0') : '0'}`,
        'STA  NET TIME POL PHA AZIM DIST TKOFANGLE RES',
        ...rows
      ];
      return out.join('\n') + '\n';
    }
    async function downloadPicks(eventId) {
      const info = $('info');
      info.textContent = 'Fetching picks for ' + eventId + '…';
      const url = `https://webservices.ingv.it/fdsnws/event/1/query?eventid=${encodeURIComponent(eventId)}` +
                  '&format=xml&includearrivals=true&includepicks=true';
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const xml = await res.text();
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        if (doc.getElementsByTagName('parsererror').length) throw new Error('XML parse error');
        const txt = buildPicksTxt(doc);
        const nRows = Math.max(0, txt.trim().split('\n').length - 3);
        downloadText(`picks_${eventId}.txt`, txt);
        info.textContent = `picks_${eventId}.txt — ${nRows} picks`;
      } catch (err) {
        console.error(err);
        info.textContent = 'Picks error: ' + err.message + ' (opening raw FDSN query)';
        window.open(url, '_blank');
      }
    }

	async function exportJPG() {
	  const btn = $('btnExp'); btn.disabled = true; btn.textContent = 'Exporting...';
	  try {
		const Z = 9, T = 256, SC = T * Math.pow(2, Z), S = 1.6;
		const mx = lon => (lon + 180) / 360 * SC;
		const my = lat => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * SC; };
		const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
		const x0 = mx(sw.lng), x1 = mx(ne.lng), y0 = my(ne.lat), y1 = my(sw.lat);
		const W = Math.round(x1 - x0), H = Math.round(y1 - y0);
		const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
		const c = cv.getContext('2d'); c.fillStyle = '#1a1a1a'; c.fillRect(0, 0, W, H);
		const jobs = [];
		for (let ty = Math.floor(y0 / T); ty <= Math.floor((y1 - 1) / T); ty++) for (let tx = Math.floor(x0 / T); tx <= Math.floor((x1 - 1) / T); tx++)
		  jobs.push(new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => { c.drawImage(im, tx * T - x0, ty * T - y0); res(1); }; im.onerror = () => res(0);
		    im.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${Z}/${ty}/${tx}`; }));
		const okTiles = (await Promise.all(jobs)).reduce((a, b) => a + b, 0);
		const P = (lon, lat) => [mx(lon) - x0, my(lat) - y0];
		const mxn = Math.max(1, ...AREAS.map(a => a.n));
		if (on.poly) AREAS.slice().sort((a, b) => b.ar - a.ar).forEach(a => {
		  c.beginPath(); a.h.forEach((p, i) => { const q = P(p[0], p[1]); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath();
		  c.globalAlpha = .35; c.fillStyle = areaColor(a, mxn); c.fill(); c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();
		});
		if (dissLayer) {
		  const walk = (a, poly) => {
		    if (!a || !a.length) return;
		    if (a[0].lat === undefined) { a.forEach(x => walk(x, poly)); return; }
		    c.beginPath(); a.forEach((ll, i) => { const q = P(ll.lng, ll.lat); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
		    if (poly) { c.closePath(); c.fillStyle = 'rgba(255,0,255,.05)'; c.fill(); }
		    c.setLineDash([6, 4]); c.strokeStyle = '#ff00ff'; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]);
		  };
		  dissLayer.eachLayer(l => { if (l.getLatLngs) walk(l.getLatLngs(), l instanceof L.Polygon); });
		}
		if (on.kde && kdeCanvas && kdeGrid) {
		  const gr = kdeGrid;
		  const lonMin = gr.lon0 + gr.xmin / gr.kx, lonMax = gr.lon0 + gr.xmax / gr.kx;
		  const latMin = gr.lat0 + gr.ymin / gr.ky, latMax = gr.lat0 + gr.ymax / gr.ky;
		  const p0 = P(lonMin, latMax), p1 = P(lonMax, latMin);
		  c.globalAlpha = 0.85;
		  c.drawImage(kdeCanvas, p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1]);
		  c.globalAlpha = 1;
		}
		events.slice().sort((a, b) => a.mag - b.mag).forEach(e => {
		  const q = P(e.lon, e.lat), hi = activeSec && activeSec.slabSet.has(e);
		  c.beginPath(); c.arc(q[0], q[1], Math.max(2, e.mag * 2) * S, 0, 6.2832); c.globalAlpha = .8; c.fillStyle = colorOf(e); c.fill(); c.globalAlpha = 1; c.lineWidth = hi ? 2 : .8; c.strokeStyle = hi ? '#fff' : '#000'; c.stroke();
		});
		if (on.bars) AREAS.filter(a => a.n).forEach(a => {
		  const h = (6 + Math.round(70 * a.n / mxn)) * S, q = P(a.cx, a.cy);
		  c.fillStyle = 'rgba(8,81,156,.85)'; c.fillRect(q[0] - 8 * S, q[1] - h, 16 * S, h); c.strokeStyle = '#000'; c.lineWidth = 1; c.strokeRect(q[0] - 8 * S, q[1] - h, 16 * S, h);
		  c.font = 'bold ' + 11 * S + 'px sans-serif'; c.textAlign = 'center'; c.lineWidth = 3; c.strokeStyle = '#fff'; c.strokeText(a.n, q[0], q[1] - h - 4); c.fillStyle = '#000'; c.fillText(a.n, q[0], q[1] - h - 4);
		});
		secs.forEach(s => {
		  const g = s.g, hw = g.hw;
		  const inv = (X, Y) => P(g.lon0 + X / g.kx, g.lat0 + Y / g.ky);
		  const cs = [[-hw * g.uy, hw * g.ux], [g.L * g.ux - hw * g.uy, g.L * g.uy + hw * g.ux], [g.L * g.ux + hw * g.uy, g.L * g.uy - hw * g.ux], [hw * g.uy, -hw * g.ux]].map(p => inv(p[0], p[1]));
		  const active = s === activeSec;
		  c.beginPath(); cs.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath();
		  c.fillStyle = 'rgba(0,229,255,.1)'; c.fill();
		  c.setLineDash([14, 9]); c.strokeStyle = active ? '#00e5ff' : '#8090a0'; c.lineWidth = 2.5; c.stroke(); c.setLineDash([]);
		  const a = P(s.A.lng, s.A.lat), b = P(s.B.lng, s.B.lat);
		  c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineWidth = active ? 4 : 2; c.strokeStyle = active ? '#00e5ff' : '#8090a0'; c.stroke();
		  c.font = 'bold 28px sans-serif'; c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = '#000'; c.fillStyle = active ? '#00e5ff' : '#8090a0';
		  [[s.la || 'A', a], [s.lb || 'B', b]].forEach(([l, q]) => { c.strokeText(l, q[0], q[1] - 12); c.fillText(l, q[0], q[1] - 12); });
		});
		if (chartMode) { const cc = $('cv'); c.fillStyle = '#fff'; c.fillRect(20, H - cc.height - 40, cc.width + 16, cc.height + 16); c.drawImage(cc, 28, H - cc.height - 32); }
		const sp = rangeEnd - rangeStart, t0 = rangeStart + sel.a * sp, t1 = rangeStart + sel.b * sp;
		const d0 = depthMin + dsel.a * (depthMax - depthMin);
		const d1 = depthMin + dsel.b * (depthMax - depthMin);
		const title = events.length + ' earthquakes';
		let sub = fmtUTC(t0) + '  ' + fmtUTC(t1) + ' UTC';
		if (colorMode === 'depth') sub += '  \u00b7  depth ' + d0.toFixed(0) + '\u2013' + d1.toFixed(0) + ' km';
		c.fillStyle = 'rgba(0,0,0,.65)'; c.fillRect(W / 2 - 400, 24, 800, 92);
		c.fillStyle = '#fff'; c.textAlign = 'center';
		c.font = 'bold 44px sans-serif'; c.fillText(title, W / 2, 72);
		c.font = '22px sans-serif';        c.fillText(sub,   W / 2, 104);
		const bw = 1100, bh = 30, bx = W / 2 - bw / 2;
		const nRows = (colorMode === 'time') ? 1 : 2;            //time mode colorbar in base periodo
		const rowH = 80, panelH = 36 + nRows * rowH, panelTop = H - 44 - panelH;
		c.fillStyle = 'rgba(255,255,255,.92)';
		c.fillRect(bx - 60, panelTop, bw + 120, panelH);
		c.strokeStyle = '#888'; c.lineWidth = 2;
		c.strokeRect(bx - 60, panelTop, bw + 120, panelH);

		const barY = i => panelTop + 24 + i * rowH;
		const legendBar = (y, stops, mA, mB) => {
		  const gr = c.createLinearGradient(bx, 0, bx + bw, 0);
		  stops.forEach(([o, col]) => gr.addColorStop(o, col));
		  c.fillStyle = gr; c.fillRect(bx, y, bw, bh);
		  c.strokeStyle = '#000'; c.lineWidth = 2; c.strokeRect(bx, y, bw, bh);
		  if (mA === undefined) return;                          
		  c.fillStyle = 'rgba(255,255,255,.8)';                  
		  if (mA > 0.0001) c.fillRect(bx, y, mA * bw, bh);
		  if (mB < 0.9999) c.fillRect(bx + mB * bw, y, (1 - mB) * bw, bh);
		  c.fillStyle = '#fff'; c.strokeStyle = '#222'; c.lineWidth = 2;   
		  [mA, mB].forEach(f => {
		    const x = bx + f * bw;
		    c.beginPath(); c.rect(x - 6, y - 5, 12, bh + 10); c.fill(); c.stroke();
		  });
		};

		const rowY0 = barY(0);
		if (colorMode === 'time') {
		  legendBar(rowY0, CM.map((col, i) => [i / (CM.length - 1), col]), sel.a, sel.b);
		  c.fillStyle = '#000'; c.font = '18px sans-serif'; c.textAlign = 'center';
		  for (let i = 0; i <= 5; i++) {
		    const x = bx + i / 5 * bw, d = new Date(rangeStart + i / 5 * sp);
		    const lab = sp <= 100 * 864e5
		      ? pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes())
		      : fmtUTC(d).slice(0, 10);
		    c.fillRect(x - 1, rowY0 + bh, 2, 8);
		    c.fillText(lab, x, rowY0 + bh + 28);
		  }
		  c.fillStyle = '#333'; c.font = '16px sans-serif';
		  c.fillText('selected  ' + fmtUTC(t0) + '    ' + fmtUTC(t1) + ' UTC', bx + bw / 2, rowY0 + bh + 54);
		} else if (colorMode === 'kde') {
		  legendBar(rowY0, KDE_STOPS.map((st, i) => [i / (KDE_STOPS.length - 1), `rgb(${st.join(',')})`]));
		  c.fillStyle = '#000'; c.font = '18px sans-serif';
		  c.textAlign = 'left';   c.fillText('0', bx, rowY0 + bh + 26);
		  c.textAlign = 'right';  c.fillText('1', bx + bw, rowY0 + bh + 26);
		  c.textAlign = 'center'; c.fillText('KDE density (log-normalised, bwr)', bx + bw / 2, rowY0 + bh + 26);
		} else if (colorMode === 'depth') {
		  legendBar(rowY0, DEPTH_STOPS.map((st, i) => [i / (DEPTH_STOPS.length - 1), `rgb(${st.join(',')})`]), dsel.a, dsel.b);
		  c.fillStyle = '#000'; c.font = '18px sans-serif';
		  c.textAlign = 'left';   c.fillText(depthMin + ' km', bx, rowY0 + bh + 26);
		  c.textAlign = 'right';  c.fillText(depthMax + ' km', bx + bw, rowY0 + bh + 26);
		  c.textAlign = 'center'; c.fillText('depth \u2014 selected ' + d0.toFixed(0) + '\u2013' + d1.toFixed(0) + ' km', bx + bw / 2, rowY0 + bh + 26);
		} else {
		  c.fillStyle = '#000'; c.font = '22px sans-serif'; c.textAlign = 'center';
		  c.fillText('colour = magnitude', bx + bw / 2, rowY0 + 22);
		}

		if (colorMode !== 'time') {
		  const rowY1 = barY(1);
		  legendBar(rowY1, CM.map((col, i) => [i / (CM.length - 1), col]), sel.a, sel.b);
		  c.fillStyle = '#000'; c.font = '16px sans-serif';
		  c.textAlign = 'left';   c.fillText(fmtUTC(rangeStart), bx, rowY1 + bh + 24);
		  c.textAlign = 'right';  c.fillText(fmtUTC(rangeEnd) + ' UTC', bx + bw, rowY1 + bh + 24);
		  c.textAlign = 'center'; c.fillText('time window \u2014 selected ' + fmtUTC(t0) + fmtUTC(t1), bx + bw / 2, rowY1 + bh + 24);
		}

		c.strokeStyle = '#ff7800'; c.lineWidth = 8; c.strokeRect(4, 4, W - 8, H - 8);
		const d = new Date(), name = d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + '.jpg';
		const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
		const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
		setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
		$('info').textContent = name + (okTiles ? '' : ' (no map tiles)');
	  } catch (err) { console.error(err); $('info').textContent = 'Export error'; }
	  btn.disabled = false; btn.textContent = 'Export JPG';
	}
    function mapEvent(f) {
      return {
        lon: f.geometry.coordinates[0],
        lat: f.geometry.coordinates[1],
        depth: f.geometry.coordinates[2],
        mag: Number(f.properties.mag) || 0,
        t: new Date(f.properties.time),
        ms: Date.parse(f.properties.time),
        place: f.properties.place,
        eventId: f.properties.eventId
      };
    }
    async function fetchEarthquakes() {
      const id = ++reqId;
      const info = $('info');
      info.textContent = 'Loading...';
      const fmt = d => d.toISOString().slice(0, 19);
      const end = customRange ? new Date(customRange.e) : new Date();
      const start = customRange ? new Date(customRange.s) : new Date(end - days * 864e5);
      const spanDays = (end - start) / 864e5;
      rangeStart = start.getTime(); rangeEnd = end.getTime();
      const baseUrl = 'https://webservices.ingv.it/fdsnws/event/1/query?format=geojson' +
        '&minlatitude=35.8&maxlatitude=41.8&minlongitude=12&maxlongitude=19.5&limit=10000&orderby=time';
      try {
        if (spanDays < 1095) {
          const url = `${baseUrl}&starttime=${fmt(start)}&endtime=${fmt(end)}`;
          const res = await fetch(url);
          if (id !== reqId) return;
          if (res.status === 204) { allEvents = []; limitHit = false; buildBar(); render(); return; }
          if (!res.ok) { info.textContent = 'Error ' + res.status; return; }
          const data = await res.json();
          if (id !== reqId) return;
          allEvents = data.features.map(mapEvent);
          limitHit = data.features.length >= 10000;
        } else {
          const chunkDays = 180;
          const cur0 = start.getTime();
          const endMs = end.getTime();
          const totalChunks = Math.ceil((endMs - cur0) / (chunkDays * 864e5));
          let chunkCount = 0;
          const collected = [];
          let anyLimit = false;
          let cur = cur0;
          while (cur < endMs) {
            if (id !== reqId) return;
            const curEnd = Math.min(cur + chunkDays * 864e5, endMs);
            info.textContent = `Loading chunk ${++chunkCount}/${totalChunks}…`;
            try {
              const res = await fetch(`${baseUrl}&starttime=${fmt(new Date(cur))}&endtime=${fmt(new Date(curEnd))}`);
              if (id !== reqId) return;
              if (res.ok) {
                const data = await res.json();
                if (data.features.length >= 10000) anyLimit = true;
                collected.push(...data.features.map(mapEvent));
              }
            } catch (e) {
              console.warn('chunk fetch failed', e);
            }
            cur = curEnd;
          }
          allEvents = collected;
          limitHit = anyLimit;
        }
        if (id !== reqId) return;
        buildBar(); render();
      } catch (e) {
        console.error('INGV fetch error:', e);
        info.textContent = 'Fetch error';
      }
    }
    (function populateRateSelect() {
      const sel = $('rsel');
      if (!sel) return;
      AREAS.forEach(a => {
        const o = document.createElement('option');
        o.value = a[0]; o.textContent = a[0];
        sel.appendChild(o);
      });
      sel.onchange = () => { if (chartMode === 'rateDepth') drawChart(); };
    })();

    fetchEarthquakes();
    setInterval(() => { if (!customRange && days <= 30) fetchEarthquakes(); }, 60000);
  </script>
</body>
</html>
