    const polyArea = h => Math.abs(h.reduce((s, p, i) => { const q = h[(i+1) % h.length]; return s + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
    function inside(h, x, y) {
      let c = false;
      for (let i = 0, j = h.length - 1; i < h.length; j = i++)
        if ((h[i][1] > y) !== (h[j][1] > y) && x < (h[j][0]-h[i][0]) * (y-h[i][1]) / (h[j][1]-h[i][1]) + h[i][0]) c = !c;
      return c;
    }
    AREAS.forEach(a => { a.h = a[1].map(p => [p[1], p[0]]); a.ar = polyArea(a.h); a.cy = a[2]; a.cx = a[3]; a.n = 0; });
    const BYSIZE = AREAS.slice().sort((a, b) => a.ar - b.ar);   //smallest area
    const map = L.map('map', { preferCanvas: true });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);
    const bounds = L.latLngBounds([35.85, 12.2], [41.8, 19.5]);
    L.rectangle(bounds, {color: "#ff7800", weight: 1, fill: false}).addTo(map);
    map.fitBounds(bounds);
    map.setMinZoom(map.getBoundsZoom(bounds));
    map.setMaxBounds(bounds);
    map.options.maxBoundsViscosity = 1.0;
    window.addEventListener('resize', () => { map.setMinZoom(map.getBoundsZoom(bounds)); map.fitBounds(bounds); });
    map.createPane('areas').style.zIndex = 350;
    const areaRenderer = L.canvas({ pane: 'areas' });
    const layerGroup = L.layerGroup().addTo(map);
    const polyLayer = L.layerGroup(), barLayer = L.layerGroup();
    const RANGES = [
      ['Last day', 1], ['Last week', 7], ['Last month', 30],
      ['Last 6 months', 182], ['Last year', 365],
      ['Last 2 years', 730], ['Last 3 years', 1095]
    ];
    const FEATS = [['depth', 'Depth histogram'], ['month', 'Month histogram'], ['mag', 'Mw histogram'],
                   ['poly', 'Area polygons'], ['bars', 'Area count bars']];
    let days = 7, reqId = 0, events = [], chartMode = null;
    const on = { poly: false, bars: false };
    function magColor(m) {
      return m >= 5 ? '#800026' : m >= 4 ? '#BD0026' : m >= 3 ? '#E31A1C' : m >= 2 ? '#FC4E2A' : m >= 1 ? '#FD8D3C' : '#FFEDA0';
    }
    const ctl = L.control({position: 'topright'});
    ctl.onAdd = () => {
      const div = L.DomUtil.create('div', 'ctl');
      L.DomEvent.disableClickPropagation(div);
      RANGES.forEach(([label, d]) => {
        const b = L.DomUtil.create('button', d === days ? 'active' : '', div);
        b.textContent = label;
        b.dataset.days = d;
        b.onclick = () => {
          days = d;
          div.querySelectorAll('button[data-days]').forEach(x => x.classList.toggle('active', x === b));
          fetchEarthquakes();
        };
      });
      div.appendChild(document.createElement('hr'));
      FEATS.forEach(([k, label]) => {
        const b = L.DomUtil.create('button', 'feat', div);
        b.textContent = label; b.dataset.k = k;
        b.onclick = () => {
          if (k === 'poly' || k === 'bars') on[k] = !on[k];
          else chartMode = chartMode === k ? null : k;
          div.querySelectorAll('button.feat').forEach(x => {
            const kk = x.dataset.k;
            x.classList.toggle('active', (kk === 'poly' || kk === 'bars') ? on[kk] : chartMode === kk);
          });
          refresh();
        };
      });
      const info = L.DomUtil.create('div', 'info', div);
      info.id = 'info';
      return div;
    };
    ctl.addTo(map);
	const legend = L.control({ position: 'bottomright' });
	legend.onAdd = () => {
	  const div = L.DomUtil.create('div', 'ctl mag-legend');
	  L.DomEvent.disableClickPropagation(div);
	  div.innerHTML =
		'<b>Magnitude</b>' +
		'<svg width="120" height="120" viewBox="-40 -40 80 80" xmlns="http://www.w3.org/2000/svg">' +
		  '<circle cx="0" cy="0"        r="10.6"   fill="#800026" fill-opacity="0.10" stroke="#800026" stroke-width="0.9"/>' +
		  '<circle cx="0" cy="2.8"      r="7.8"    fill="#800026" fill-opacity="0.10" stroke="#800026" stroke-width="0.9"/>' +
		  '<circle cx="0" cy="6.7"      r="3.9"    fill="#BD0026" fill-opacity="0.12" stroke="#BD0026" stroke-width="0.9"/>' +
		  '<circle cx="0" cy="8.65"     r="1.95"   fill="#E31A1C" fill-opacity="0.15" stroke="#E31A1C" stroke-width="0.9"/>' +
		  '<circle cx="0" cy="9.625"    r="0.975"  fill="#FD8D3C" fill-opacity="0.30" stroke="#FD8D3C" stroke-width="0.9"/>' +
		  '<circle cx="0" cy="10.1125"  r="0.4875" fill="#FFEDA0" fill-opacity="0.60" stroke="#FFEDA0" stroke-width="0.9"/>' +
			  '<text x="19"   y="14">1</text>' +
			  '<text x="19"   y="7">2</text>' +
			  '<text x="19"   y="0">3</text>' +
			  '<text x="19"  y="-7">4</text>' +
			  '<text x="19"  y="-13">5</text>' +
			  '<text x="19"  y="-20">6</text>' +
		'</svg>' +
		'<div style="font-size:10px;color:#666;margin-top:2px">Mw / ML</div>';
	  return div;
	};
	legend.addTo(map);
    //istogrammi
    function drawHist(title, labels, counts, xlab) {
      const cv = document.getElementById('cv'), c = cv.getContext('2d'), W = cv.width, H = cv.height;
      const m = { l: 48, r: 10, t: 28, b: 48 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
      c.clearRect(0, 0, W, H); c.fillStyle = '#000'; c.font = 'bold 13px sans-serif'; c.textAlign = 'center';
      c.fillText(title + '  (N=' + counts.reduce((a, b) => a + b, 0) + ')', W / 2, 16);
      const mx = Math.max(1, ...counts), bw = pw / counts.length;
      c.font = '10px sans-serif'; c.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const v = Math.round(mx * i / 4), y = m.t + ph - ph * i / 4;
        c.strokeStyle = '#ddd'; c.beginPath(); c.moveTo(m.l, y); c.lineTo(W - m.r, y); c.stroke();
        c.fillStyle = '#000'; c.fillText(v, m.l - 4, y + 3);
      }
      c.fillStyle = '#BD0026';
      counts.forEach((n, i) => c.fillRect(m.l + i * bw + 1, m.t + ph - ph * n / mx, Math.max(1, bw - 2), ph * n / mx));
      c.fillStyle = '#000'; c.textAlign = 'center';
      const step = Math.ceil(counts.length / 10);
      labels.forEach((s, i) => { if (i % step === 0) c.fillText(s, m.l + (i + .5) * bw, m.t + ph + 12); });
      c.font = '11px sans-serif'; c.fillText(xlab, m.l + pw / 2, H - 6);
      c.save(); c.translate(11, m.t + ph / 2); c.rotate(-Math.PI / 2); c.fillText('Number of earthquakes', 0, 0); c.restore();
    }
    function bin(vals, w, min) {
      if (!vals.length) return [[], []];
      const lo = Math.floor((min ?? Math.min(...vals)) / w) * w, n = Math.floor((Math.max(...vals) - lo) / w) + 1;
      const cnt = new Array(n).fill(0), lab = [];
      vals.forEach(v => cnt[Math.floor((v - lo) / w)]++);
      for (let i = 0; i < n; i++) lab.push((lo + i * w).toFixed(w < 1 ? 1 : 0));
      return [lab, cnt];
    }
    function drawChart() {
      const box = document.getElementById('chart');
      box.style.display = chartMode ? 'block' : 'none';
      if (!chartMode) return;
      if (chartMode === 'depth') { const [l, c] = bin(events.map(e => e.depth), 5, 0); drawHist('Depth distribution (5 km bins)', l, c, 'Depth (km)'); }
      else if (chartMode === 'mag') { const [l, c] = bin(events.map(e => e.mag), 0.2); drawHist('Magnitude distribution (0.2 bins)', l, c, 'Magnitude (Mw/ML, source INGV)'); }
      else {
        const keys = events.map(e => e.t.getFullYear() * 12 + e.t.getMonth());
        if (!keys.length) return drawHist('Events per month', [], [], 'Month');
        const lo = Math.min(...keys), n = Math.max(...keys) - lo + 1, c = new Array(n).fill(0), l = [];
        keys.forEach(k => c[k - lo]++);
        for (let i = 0; i < n; i++) { const k = lo + i; l.push(Math.floor(k / 12) + '-' + String(k % 12 + 1).padStart(2, '0')); }
        drawHist('Events per month', l, c, 'Month (local time)');
      }
    }
    //aree sud
    const ramp = ['#ffffcc', '#ffeda0', '#fd8d3c', '#e31a1c', '#800026'];
    function drawAreas() {
      polyLayer.clearLayers(); barLayer.clearLayers();
      AREAS.forEach(a => a.n = 0);
      events.forEach(e => { const a = BYSIZE.find(a => inside(a.h, e.lon, e.lat)); if (a) a.n++; });
      const mx = Math.max(1, ...AREAS.map(a => a.n));
      //larger, smaller. overlapping
      if (on.poly) AREAS.slice().sort((a, b) => b.ar - a.ar).forEach(a => {
        const f = a.n ? ramp[Math.min(4, 1 + Math.floor(3.999 * Math.log(a.n + 1) / Math.log(mx + 1)))] : ramp[0];
        L.polygon(a.h.map(p => [p[1], p[0]]), { pane: 'areas', renderer: areaRenderer, color: '#fff', weight: 1, fillColor: f, fillOpacity: 0.35 })
          .bindPopup(`<b>${a[0]}</b><br>${a.n} events`).addTo(polyLayer);
      });
      if (on.bars) AREAS.filter(a => a.n).forEach(a => {
        const h = 6 + Math.round(70 * a.n / mx);
        L.marker([a.cy, a.cx], { interactive: false, icon: L.divIcon({ className: '', iconSize: [30, h + 12], iconAnchor: [15, h + 12],
          html: `<div class="abar">${a.n}<div style="height:${h}px"></div></div>` }) }).addTo(barLayer);
      });
      [[polyLayer, on.poly], [barLayer, on.bars]].forEach(([g, s]) => s ? g.addTo(map) : map.removeLayer(g));
    }
    function refresh() { drawChart(); drawAreas(); }

    async function fetchEarthquakes() {
      const id = ++reqId;
      const info = document.getElementById('info');
      info.textContent = 'Loading...';
      const fmt = d => d.toISOString().slice(0, 19);
      const end = new Date(), start = new Date(end - days * 864e5);
      const url = `https://webservices.ingv.it/fdsnws/event/1/query?format=geojson&starttime=${fmt(start)}&endtime=${fmt(end)}&minlatitude=35.9&maxlatitude=41&minlongitude=12.2&maxlongitude=19.5&limit=10000&orderby=time`;
      try {
        const res = await fetch(url);
        if (id !== reqId) return;
        if (res.status === 204) { layerGroup.clearLayers(); events = []; refresh(); info.textContent = '0 events'; return; }
        if (!res.ok) { info.textContent = 'Error ' + res.status; return; }
        const data = await res.json();
        if (id !== reqId) return;
        layerGroup.clearLayers();
        events = data.features.map(f => ({ lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], depth: f.geometry.coordinates[2],
          mag: Number(f.properties.mag) || 0, t: new Date(f.properties.time) }));
        data.features.sort((a, b) => (a.properties.mag || 0) - (b.properties.mag || 0)).forEach(f => {
          const [lon, lat, depth] = f.geometry.coordinates;
          const { mag, place, time, eventId } = f.properties;
          const m = Number(mag) || 0;
          L.circleMarker([lat, lon], {
            radius: Math.max(2, m * 2), fillColor: magColor(m),
            color: '#000', weight: 0.5, opacity: 1, fillOpacity: 0.8
          }).bindPopup(`<b>M${m.toFixed(1)}</b><br>${place}<br>Depth: ${depth} km<br>${new Date(time).toLocaleString()}<br><a href="https://terremoti.ingv.it/event/${eventId}" target="_blank">Details</a>`)
            .addTo(layerGroup);
        });
        refresh();
        info.textContent = data.features.length + ' events' + (data.features.length >= 10000 ? ' (limit hit)' : '');
      } catch (e) {
        console.error('INGV fetch error:', e);
        info.textContent = 'Fetch error';
      }
    }
    fetchEarthquakes();
    setInterval(fetchEarthquakes, 60000);
  </script>
